name: "Build and Test"

on:
  pull_request:
    types: [ "opened", "synchronize", "reopened", "closed" ]
  push:
    branches: [ "nixos-*" ]
  schedule:
    - cron: "45 2 * * *"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v17
        with:
          name: pjones
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Update All Dependencies for Nightly Builds
        if: github.event_name == 'schedule'
        run: nix flake update

      - name: macOS Package Only
        if: runner.os == 'macOS'
        run: nix build --print-build-logs

      - name: Linux Full Check
        if: runner.os == 'Linux'
        run: |
          # GitHub can't build all of my checks so I need to remove some.
          set -eu
          set -o pipefail

          system=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          jobs=()

          while IFS= read -r -d "" job; do
            jobs+=(".#checks.$system.$job")
          done < <(
            nix flake show --json |
              jq --raw-output0 \
                --arg system "$system" \
                --argjson skip '["wireguard", "kanidm", "prometheus"]' \
                '.checks.[$system] | keys | map(select(. | IN($skip[]) | not)) | .[]'
          )

          nix build --print-build-logs "${jobs[@]}"
